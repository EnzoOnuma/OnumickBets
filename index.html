<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onumick Bets</title>
    <link rel="stylesheet" href="./src/css/estilo.css">
</head>
<body>
    <header>
        <h1 class="titulo">OnumickBets 2026</h1>
    </header>
    <main>
        <h2>Próximas partidas</h2>
        <section class="card">
            <div class="card-jogo">
                <h3>Brasil vs Haiti</h3>
                <h4>21/06 - 21:30</h4>
                <p><input type="number" min="0" max="10" placeholder="Brasil" id="time1-1"></p>
                <p><input type="number" min="0" max="10" placeholder="Haiti" id="time2-1"></p>
                <button onclick="salvarPalpite('Brasil vs Haiti',1)" class="botao-palpite">Palpite</button>
            </div>
            <div class ="card-jogo">
                <h3>Holanda vs Japão</h3>
                <h4>15/06 - 16:00</h4>
                <p><input type="number" min="0" max="10" placeholder="Holanda" id="time1-2"></p>
                <p><input type="number" min="0" max="10" placeholder="Japão" id="time2-2"></p>
                <button onclick="salvarPalpite('Holanda vs Japão',2)" class="botao-palpite">Palpite</button>
            </div>
        </section>
        <h2>Histórico de Palpites</h2>
        <section id="historico">
        
        </section>
    </main>
    <footer>
        <p>&copy;- 2026 - Bolão</p>
    </footer>

    <!--JS EXTERNO-->
    <script src="./src/js/script.js"></script>
</body>
</html>
